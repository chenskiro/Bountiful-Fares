name: Build Bountiful Fares 1.20.1-Forge

on:
  push:
    branches: [ "1.20.1-forge" ]
  pull_request:
    branches: [ "1.20.1-forge" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 1.20.1-forge  # 明确指定构建的分支
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bountifulfares-1.20.1-forge
          path: build/libs/bountifulfares-1.20.1-*.jar
          retention-days: 14
          if-no-files-found: error
